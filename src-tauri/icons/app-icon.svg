<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- LyricHub app icon, source for `npx tauri icon`: a speech bubble with two lyric lines,
       the first one half filled like the karaoke line. Bold shapes, so it reads at 16 px;
       violet and amber, no brand colours. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3ec8"/>
      <stop offset="1" stop-color="#241a5c"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc24a"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="224" fill="url(#bg)"/>
  <path d="M236 228 H788 A112 112 0 0 1 900 340 V610 A112 112 0 0 1 788 722 H470 L292 858 V722 H236 A112 112 0 0 1 124 610 V340 A112 112 0 0 1 236 228 Z" fill="#ffffff"/>
  <rect x="214" y="344" width="596" height="112" rx="56" fill="#b9b1e3"/>
  <rect x="214" y="344" width="352" height="112" rx="56" fill="url(#fill)"/>
  <rect x="214" y="510" width="420" height="104" rx="52" fill="#b9b1e3"/>
</svg>
