[package]
name = "lyrichub"
version = "1.0.1"
description = "Game overlay that shows Spotify lyrics karaoke-style, in sync with the audio"
authors = ["HeiligerHoly"]
license-file = "../LICENSE"
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "lyrichub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
# Japanese word readings for romaji (docs/romaji.md). The IPADIC is embedded uncompressed, so it
# stays in the mapped image instead of private memory; its build script downloads it once.
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking", "query"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_DirectWrite",
  "Win32_Globalization",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Media",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
