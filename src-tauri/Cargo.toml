[package]
name = "lyrichub"
version = "0.0.1"
description = "Game overlay that shows Spotify lyrics karaoke-style, in sync with the audio"
authors = ["Kiyu"]
edition = "2024"
publish = false

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo issue 8519 on Windows).
name = "lyrichub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
  "Media",
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
