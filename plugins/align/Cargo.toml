[package]
name = "lyrichub-align"
version = "0.2.0"
description = "LyricHub plugin: real word times from the player's sound (PLAN-plugins.md, P3)"
authors = ["HeiligerHoly"]
license-file = "../../LICENSE"
edition = "2024"
publish = false

[dependencies]
serde_json = "1.0.154"
sha2 = "0.10"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.0", default-features = false, features = ["native-tls"] }
# Prebuilt ONNX Runtime, linked statically: the plugin ships as one exe.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "api-24"] }
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 4
