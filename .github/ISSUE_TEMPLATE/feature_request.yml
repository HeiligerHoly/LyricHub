name: Idea
description: Suggest a feature or an improvement.
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with?
      description: The situation you are in and what is missing or annoying today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work. Sketches and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead
